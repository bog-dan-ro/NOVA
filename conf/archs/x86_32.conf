# Configure cross-toolchain prefix (see README.md)
PREFIX		?= # set your own, e.g. /opt/i486-linux/bin/i486-linux-

# Default BOARD
BOARD		?= pc

# Configure architecture-specific run targets
RUN		?= qemu-system-i386 -m 64 -smp 1 -no-reboot -display none -serial mon:stdio -M pc

# Configure architecture-specific ELF image tweaks
H2E		?= $(TGT_OC) -O elf32-i386

# Configure architecture-specific BIN image tweaks
H2B		?= $(TGT_OC) -O binary

# Configure architecture-specific machine flags
MFLAGS		:= -Wa,--divide,--noexecstack -march=i486 -m32 -mgeneral-regs-only -mno-red-zone

# Configure bootstrap-specific machine flags
BSP_MFLAGS	:= -Wa,--divide,--noexecstack -march=i486 -m32 -mgeneral-regs-only -mno-red-zone

# Configure architecture-specific preprocessor defines
ARCH_DEFINES	:=

# Configure architecture-specific warning flags (none for x86_32)
ARCH_WFLAGS	:=

# Configure architecture-specific linker flags
ARCH_LFLAGS	:=

# Configure architecture-specific install integrity check
INSTALL_INTEGRITY := no
