# Configure cross-toolchain prefix (see README.md)
PREFIX		?= # set your own, e.g. /opt/x86_64-linux/bin/x86_64-linux-

# Configure architecture-specific ELF image tweaks
H2E		?= $(TGT_OC) -O elf32-i386

# Configure architecture-specific BIN image tweaks
H2B		?= $(TGT_OC) -O binary

# Configure architecture-specific run targets
RUN		?= qemu-system-x86_64  -m 512 -smp 4 -no-reboot -display none -serial mon:stdio -cpu host,vmx -M q35,accel=kvm,kernel-irqchip=split -enable-kvm -device intel-iommu,intremap=on -kernel

# Configure architecture-specific machine flags
MFLAGS		:= -Wa,--divide,--noexecstack -march=x86-64-v2 -mcmodel=kernel -mgeneral-regs-only -mno-red-zone

# Configure architecture-specific preprocessor defines (none for x86_64)
ARCH_DEFINES	:=

# Configure architecture-specific warning flags (none for x86_64)
ARCH_WFLAGS	:=

# Configure HYP output naming pattern (no BOARD in filename)
HYP_NAMING	:= $(BLD_DIR)/$(ARCH)-nova

# Configure architecture-specific install integrity check
INSTALL_INTEGRITY := yes
